<script>
(function () {
  var POSTS = (window.BLOG_POSTS || []).slice();

  /* newest first */
  POSTS.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });

  var listEl = document.getElementById("list");
  var chipsEl = document.getElementById("topic-chips");
  var emptyEl = document.getElementById("empty");
  var qEl = document.getElementById("q");

  var state = { topic: null, q: "" };

  /* ---- topic counts ---- */
  var counts = {};
  POSTS.forEach(function (p) {
    (p.topics || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
  });
  var topics = Object.keys(counts).sort();

  function fmtDate(d) {
    if (!d) return "";
    var parts = d.split("-");
    if (parts.length !== 3) return d;
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[parseInt(parts[1], 10) - 1] + " " + parseInt(parts[2], 10) + ", " + parts[0];
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---- render filter chips ---- */
  function renderChips() {
    var html = '<a class="chip' + (state.topic === null ? " active" : "") + '" data-topic="">All<span class="cnt">'
      + POSTS.length + "</span></a>";
    topics.forEach(function (t) {
      html += '<a class="chip' + (state.topic === t ? " active" : "") + '" data-topic="' + esc(t) + '">'
        + esc(t) + '<span class="cnt">' + counts[t] + "</span></a>";
    });
    chipsEl.innerHTML = html;

    Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function (c) {
      c.addEventListener("click", function () {
        state.topic = c.getAttribute("data-topic") || null;
        syncURL();
        renderChips();
        renderList();
      });
    });
  }

  /* ---- render post list ---- */
  function renderList() {
    var q = state.q.trim().toLowerCase();
    var shown = POSTS.filter(function (p) {
      if (state.topic && (p.topics || []).indexOf(state.topic) === -1) return false;
      if (!q) return true;
      var hay = [(p.en && p.en.title) || "", (p.zh && p.zh.title) || "",
                 (p.en && p.en.summary) || "", (p.zh && p.zh.summary) || "",
                 (p.topics || []).join(" "), p.date || ""].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    if (!shown.length) {
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    listEl.innerHTML = shown.map(function (p) {
      var base = "posts/" + p.slug + "/";
      var primary = p.en || p.zh;
      var secondary = p.en ? p.zh : null;
      var langs = [];
      if (p.en) langs.push('<a href="' + base + 'en.html">English</a>');
      if (p.zh) langs.push('<a href="' + base + 'zh.html">中文</a>');

      var tags = (p.topics || []).map(function (t) {
        return '<a class="tag" href="?topic=' + encodeURIComponent(t) + '" data-topic="' + esc(t) + '">' + esc(t) + "</a>";
      }).join("");

      return '<article class="post-card">'
        + '<div class="post-date">' + esc(fmtDate(p.date)) + "</div>"
        + '<h2 class="post-title"><a href="' + base + (p.en ? "en" : "zh") + '.html">' + esc(primary.title) + "</a></h2>"
        + (secondary ? '<p class="post-title-alt"><a href="' + base + 'zh.html">' + esc(secondary.title) + "</a></p>" : "")
        + '<p class="post-summary">' + esc(primary.summary || "") + "</p>"
        + '<div class="post-foot">'
        +   '<div class="post-topics">' + tags + "</div>"
        +   '<div class="post-langs">' + langs.join(' <span style="color:#c3c9cf">·</span> ') + "</div>"
        + "</div>"
        + "</article>";
    }).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll(".tag[data-topic]"), function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        state.topic = a.getAttribute("data-topic");
        syncURL();
        renderChips();
        renderList();
      });
    });
  }

  /* ---- URL sync (?topic=RPKI) so topic views are shareable ---- */
  function syncURL() {
    var url = location.pathname + (state.topic ? "?topic=" + encodeURIComponent(state.topic) : "");
    history.replaceState(null, "", url);
  }

  var params = new URLSearchParams(location.search);
  var t = params.get("topic");
  if (t && counts[t]) state.topic = t;

  qEl.addEventListener("input", function () { state.q = qEl.value; renderList(); });

  renderChips();
  renderList();
})();
</script>
